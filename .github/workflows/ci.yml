name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: just setup
      - run: just check
      - run: just api-types-check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: calendar:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for it to report healthy
        run: |
          docker run -d --name smoke -p 127.0.0.1:18100:8000 \
            -e APP_BASE_URL=http://127.0.0.1:18100 --tmpfs /data:uid=1000 calendar:dev
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:18100/api/v1/health && exit 0
            sleep 0.5
          done
          docker logs smoke
          exit 1
